<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お話の記憶 PRO — 検品キュー</title>
<style>
  :root {
    --navy: #20304F; --paper: #F7F4EC; --shu: #C9372C;
    --green: #2E7D4F; --gray: #8a8577;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
         background: var(--paper); color: var(--navy); }
  header { position: sticky; top: 0; z-index: 5; background: var(--navy); color: #fff;
           padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
  header button { min-height: 44px; padding: 0 14px; border: 1px solid #ffffff55;
                  border-radius: 8px; background: transparent; color: #fff; font-size: 13px; }
  .progress { padding: 10px 16px; font-size: 13px; color: var(--gray); }
  .list { padding: 0 12px 40px; }
  .card { background: #fff; border: 1px solid #e5e0d2; border-radius: 12px;
          margin-bottom: 10px; padding: 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .badge.lv { color: var(--navy); border-color: var(--navy); }
  .badge.ok { color: #fff; background: var(--shu); border-color: var(--shu); }
  .badge.ng { color: #fff; background: var(--gray); border-color: var(--gray); }
  .badge.todo { color: var(--gray); border-color: var(--gray); }
  .title { flex: 1; font-size: 14px; font-weight: 600; }
  .meta { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .detail { display: none; margin-top: 12px; border-top: 1px dashed #d8d2bf; padding-top: 12px; }
  .card.open .detail { display: block; }
  audio { width: 100%; height: 40px; margin: 6px 0 10px; }
  .scene { font-size: 15px; line-height: 1.9; margin-bottom: 6px; }
  .scene b { color: var(--shu); font-weight: 600; font-size: 12px; margin-right: 6px; }
  .q { background: var(--paper); border-radius: 10px; padding: 12px; margin: 10px 0; }
  .q-head { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .q-type { color: var(--shu); margin-right: 6px; }
  .q-prompt { font-size: 15px; line-height: 1.8; }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
             gap: 8px; margin-top: 8px; }
  .choice { font-size: 12px; padding: 6px; border-radius: 8px; background: #fff;
            border: 2px solid #ddd6c2; text-align: center; }
  .choice img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block;
                border-radius: 6px; margin-bottom: 2px; }
  .choice.correct { border-color: var(--shu); color: var(--shu); font-weight: 600; }
  .choice small { color: var(--gray); margin-left: 4px; }
  .judge { display: flex; gap: 10px; margin-top: 14px; }
  .judge button { flex: 1; min-height: 48px; font-size: 16px; font-weight: 700;
                  border-radius: 10px; border: 2px solid; background: #fff; }
  .judge .ok-btn { color: var(--shu); border-color: var(--shu); }
  .judge .ok-btn.active { background: var(--shu); color: #fff; }
  .judge .ng-btn { color: var(--gray); border-color: var(--gray); }
  .judge .ng-btn.active { background: var(--gray); color: #fff; }
  textarea { width: 100%; min-height: 64px; margin-top: 10px; border: 1px solid #ddd6c2;
             border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; }
  .empty { text-align: center; padding: 60px 20px; color: var(--gray); }
</style>
</head>
<body>
<header>
  <h1>検品キュー</h1>
  <button id="exportBtn">JSON書き出し</button>
</header>
<div class="progress" id="progress">読み込み中…</div>
<div class="list" id="list"></div>

<script>
const STORE_KEY = "ohanashi_pro_review_v1";
const CONTENT = "/pro/content/";
const SPEED_FACTOR = 1.25;  // 本文は音声自体を1.25倍速で合成済み(想定秒数の表示換算用)
const store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
let items = [];
let ALIAS = {};  // image_key(表記ゆれ) → 正規スラッグ (image_alias_map.json)
let LABELS = {}; // choice id(ローマ字) → ひらがな表示名 (choice_labels.json)

// 選択肢の絵カードURL。ライブラリはエイリアス解決後の正規スラッグで引く。
function choiceImg(imageKey) {
  if (!imageKey) return "";
  const canon = ALIAS[imageKey] || imageKey;
  return `<img src="${CONTENT}images/${esc(canon)}.png" loading="lazy"
               onerror="this.style.display='none'" alt="">`;
}

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); renderProgress(); }

function renderProgress() {
  const done = items.filter(it => store[it.unit_id] && store[it.unit_id].result).length;
  document.getElementById("progress").textContent =
    items.length ? `判定済み ${done} / ${items.length} 件` : "検品対象がありません";
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function badge(unitId) {
  const j = store[unitId];
  if (!j || !j.result) return '<span class="badge todo">未</span>';
  return j.result === "OK" ? '<span class="badge ok">OK</span>' : '<span class="badge ng">NG</span>';
}

const DUMMY_LABEL = {strong:"強", category:"同類", numeric:"数", attribute_swap:"属性替", scene_composite:"場面違", emotion_set:"表情"};
const MARK = {maru:"○", sankaku:"△", shikaku:"□", batsu:"×"};
const COLOR = {aka:"赤", ao:"青", midori:"緑", kuro:"黒", kiiro:"黄"};

function render() {
  const list = document.getElementById("list");
  if (!items.length) {
    list.innerHTML = '<div class="empty">review_manifest.json がありません。<br>先に pipeline/audio.py を実行してください。</div>';
    renderProgress();
    return;
  }
  list.innerHTML = items.map((it, idx) => {
    const j = store[it.unit_id] || {};
    return `
    <div class="card" id="card-${idx}">
      <div class="card-head" onclick="toggle(${idx})">
        <span class="badge lv">${it.group ? esc(it.group) + " " : ""}Lv${it.level}</span>
        <div style="flex:1">
          <div class="title">${esc(it.theme)}</div>
          <div class="meta">${esc(it.unit_id)} ・ ${it.char_count}字 ・ 目標${Math.round(it.expected_duration_sec / SPEED_FACTOR)}秒(1.25倍速)${it.measured_duration_sec ? ` / 実測${Math.round(it.measured_duration_sec)}秒` : ""}</div>
        </div>
        ${badge(it.unit_id)}
      </div>
      <div class="detail">
        <div class="q-head">📖 本文（morioki・1.25倍速合成）</div>
        <audio controls preload="none" class="story-audio" src="${CONTENT}${it.story_audio}"></audio>
        ${it.story_scenes.map(s => `<div class="scene"><b>場面${s.seq}</b>${esc(s.text)}</div>`).join("")}
        ${it.questions.map((q, qi) => `
          <div class="q">
            <div class="q-head"><span class="q-type">${q.type}</span>設問${qi+1}
              〈${COLOR[q.instruction.color]||q.instruction.color}の${MARK[q.instruction.mark]||q.instruction.mark}${q.instruction.multi?"・ぜんぶ":""}〉</div>
            <audio controls preload="none" src="${CONTENT}${q.audio}"></audio>
            <div class="q-prompt">${esc(q.prompt_text)}</div>
            <div class="choices">
              ${q.choices.map(c => `
                <span class="choice ${q.correct.includes(c.id) ? "correct" : ""}">
                  ${choiceImg(c.image_key)}
                  ${q.correct.includes(c.id) ? "✓ " : ""}${esc(LABELS[c.id] || c.id)}
                  ${c.dummy_kind ? `<small>${DUMMY_LABEL[c.dummy_kind]||c.dummy_kind}</small>` : ""}
                </span>`).join("")}
            </div>
          </div>`).join("")}
        <div class="judge">
          <button class="ok-btn ${j.result==="OK"?"active":""}" onclick="judge('${it.unit_id}','OK',${idx})">OK ○</button>
          <button class="ng-btn ${j.result==="NG"?"active":""}" onclick="judge('${it.unit_id}','NG',${idx})">NG ✕</button>
        </div>
        <textarea placeholder="メモ（誤読・間・アクセント など）"
          onchange="memo('${it.unit_id}', this.value)">${esc(j.memo || "")}</textarea>
      </div>
    </div>`;
  }).join("");
  // 1.25倍速は音声ファイル自体に焼き込み済み(STORY_SPEED_FACTOR)のためプレイヤーは等倍再生。
  renderProgress();
}

function toggle(idx) { document.getElementById("card-" + idx).classList.toggle("open"); }

function judge(unitId, result, idx) {
  store[unitId] = Object.assign({}, store[unitId], { result, at: new Date().toISOString() });
  save();
  const card = document.getElementById("card-" + idx);
  card.querySelector(".ok-btn").classList.toggle("active", result === "OK");
  card.querySelector(".ng-btn").classList.toggle("active", result === "NG");
  card.querySelector(".card-head").innerHTML = card.querySelector(".card-head").innerHTML
    .replace(/<span class="badge (ok|ng|todo)">.*?<\/span>$/, badge(unitId));
}

function memo(unitId, value) {
  store[unitId] = Object.assign({}, store[unitId], { memo: value });
  save();
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const out = {
    exported_at: new Date().toISOString(),
    total: items.length,
    judged: items.filter(it => store[it.unit_id] && store[it.unit_id].result).length,
    results: items.map(it => ({
      unit_id: it.unit_id, level: it.level, theme: it.theme,
      result: (store[it.unit_id] || {}).result || null,
      memo: (store[it.unit_id] || {}).memo || "",
      judged_at: (store[it.unit_id] || {}).at || null,
    })),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `review_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

Promise.all([
  fetch(CONTENT + "review_manifest.json")
    .then(r => r.ok ? r.json() : { items: [] }).catch(() => ({ items: [] })),
  fetch(CONTENT + "image_alias_map.json")
    .then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch(CONTENT + "choice_labels.json")
    .then(r => r.ok ? r.json() : {}).catch(() => ({})),
]).then(([data, alias, labels]) => {
  items = data.items || []; ALIAS = alias || {}; LABELS = labels || {}; render();
});
</script>
</body>
</html>
