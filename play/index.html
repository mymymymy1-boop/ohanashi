<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F3ECDC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おはなし">
<link rel="manifest" href="/pro/play.webmanifest">
<link rel="apple-touch-icon" href="/pro/icon-192.png">
<title>おはなしの きおく</title>
<style>
  /* ============================================================
     お話の記憶 PRO — こども本番モード「答案用紙メソッド」
     受験文具の世界観（解答用紙・クーピー・朱の採点丸）が主役。
     ============================================================ */
  :root{
    --paper:#F3ECDC; --paper-hi:#FBF6EA; --rule:rgba(32,48,79,.09);
    --ink:#2A2A28; --ink-soft:#6A6455;
    --navy:#20304F; --navy-2:#2C4166;
    --shu:#C9372C; --shu-ink:#A82A21;
    --k-aka:#E0342F; --k-ao:#2D5BA8; --k-midori:#2E7D4F; --k-kuro:#1A1A1A; --k-kiiro:#D99400;
    --hanamaru:#E4A62C; --line:rgba(32,48,79,.2);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Zen Old Mincho","Noto Serif JP",serif;
    --maru:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",YuGothic,sans-serif;
    --sans:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ height:100%; }
  body{ margin:0; font-family:var(--maru); color:var(--ink);
        background:var(--paper); overflow:hidden; -webkit-font-smoothing:antialiased; }

  .screen{ position:fixed; inset:0; display:none; flex-direction:column;
           padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  .screen.active{ display:flex; }

  .paperbg{ position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      repeating-linear-gradient(transparent 0 39px, var(--rule) 39px 40px),
      linear-gradient(180deg,var(--paper-hi),var(--paper));
    background-position:0 60px,0 0; }
  .sheet-head{ position:relative; z-index:1; display:flex; align-items:center; gap:8px;
               padding:12px 18px; font-size:11px; letter-spacing:.18em; color:var(--ink-soft);
               border-bottom:1.5px solid rgba(32,48,79,.18); font-family:var(--sans); }
  .sheet-head .no{ margin-left:auto; border:1.2px solid rgba(32,48,79,.3); border-radius:5px;
                   padding:3px 9px; letter-spacing:.1em; }

  .maru-svg path{ fill:none; stroke:var(--shu); stroke-width:6.5; stroke-linecap:round; }
  .maru-svg.k path{ stroke:var(--mkcolor,var(--shu)); }
  .maru-draw path{ stroke-dasharray:320; stroke-dashoffset:320; }
  .maru-draw.run path{ animation:draw .6s ease forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  /* ---- ホーム ---- */
  #home{ align-items:center; justify-content:center; text-align:center; }
  .home-body{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:22px; padding:24px; }
  .brand{ position:relative; padding:30px 34px; }
  .brand .maru-svg{ position:absolute; inset:-8px -4px; width:calc(100% + 8px); height:calc(100% + 18px); transform:rotate(-4deg); }
  .brand h1{ font-family:var(--serif); font-size:clamp(34px,9vw,46px); margin:0; letter-spacing:.06em; color:var(--navy); font-weight:600; }
  .brand .kana{ font-family:var(--maru); font-size:13px; letter-spacing:.42em; color:var(--ink-soft); margin-top:9px; }
  .today{ font-family:var(--maru); font-size:15px; color:var(--ink-soft);
          background:#ffffffaa; border:1px solid rgba(32,48,79,.16); border-radius:999px; padding:8px 18px; }
  .start{ font-family:var(--maru); font-weight:800; font-size:30px; color:#fff; background:var(--navy);
          border:none; border-radius:22px; padding:22px 60px; box-shadow:0 6px 0 #16223a;
          display:inline-flex; align-items:center; gap:14px; cursor:pointer; }
  .start:active{ transform:translateY(4px); box-shadow:0 2px 0 #16223a; }
  .start .dot{ width:15px; height:15px; border-radius:50%; background:var(--shu); }
  .moshi-btn{ font-family:var(--maru); font-weight:800; font-size:18px; color:var(--navy);
              background:#fff; border:2px solid var(--navy); border-radius:16px; padding:14px 30px;
              min-height:56px; cursor:pointer; }
  .home-foot{ display:flex; gap:14px; }
  .home-foot button{ font-family:var(--maru); font-size:16px; font-weight:700; color:var(--navy);
                     background:#ffffffcc; border:1.5px solid rgba(32,48,79,.2); border-radius:16px;
                     padding:13px 20px; min-height:52px; cursor:pointer; }

  /* ---- 出題 ---- */
  #play{ background:var(--paper); }
  .stage{ position:relative; z-index:1; flex:1; display:flex; flex-direction:column; }
  .stage-center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:24px; padding:24px; }
  .speak{ font-family:var(--maru); font-size:23px; font-weight:800; line-height:1.65; color:var(--navy); max-width:640px; }
  .speak small{ display:block; font-size:16px; color:var(--ink-soft); font-weight:700; margin-top:8px; }
  .breath{ width:150px; height:150px; position:relative; display:grid; place-items:center; }
  .breath .maru-svg{ position:absolute; inset:0; animation:breathe 3.4s ease-in-out infinite; }
  .breath .ear{ font-size:54px; }
  @keyframes breathe{ 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.09);opacity:1} }
  .scene-dots{ display:flex; gap:11px; }
  .scene-dots i{ width:12px; height:12px; border-radius:50%; border:2px solid var(--shu); }
  .scene-dots i.done{ background:var(--shu); }
  .oto{ font-family:var(--maru); font-size:13px; color:var(--ink-soft); letter-spacing:.08em; }
  .moshi-tag{ font-family:var(--maru); font-size:14px; font-weight:800; color:var(--shu);
              border:1.5px solid var(--shu); border-radius:999px; padding:5px 14px; }
  .story-again{ display:flex; gap:16px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
  .mini-btn{ font-family:var(--maru); font-weight:800; font-size:20px; border:none; border-radius:16px; padding:16px 26px; cursor:pointer; }
  .mini-btn.ghost{ background:#ffffffcc; color:var(--navy); border:1.5px solid rgba(32,48,79,.24); }
  .mini-btn.go{ background:var(--shu); color:#fff; box-shadow:0 5px 0 var(--shu-ink); }

  .q-top{ display:flex; align-items:center; gap:12px; padding:14px 16px; }
  .ring{ width:56px; height:56px; flex:0 0 auto; }
  .ring .bg{ fill:none; stroke:rgba(32,48,79,.14); stroke-width:6; }
  .ring .fg{ fill:none; stroke:var(--mkcolor,var(--shu)); stroke-width:6; stroke-linecap:round;
             stroke-dasharray:151; stroke-dashoffset:0; transform:rotate(-90deg); transform-origin:center; }
  .q-instr{ flex:1; display:flex; align-items:center; gap:10px; }
  .q-mark{ width:40px; height:40px; border:3px solid var(--mkcolor,var(--shu)); border-radius:10px;
           color:var(--mkcolor,var(--shu)); font-size:26px; font-weight:900; display:grid; place-items:center; }
  .q-say{ font-family:var(--maru); font-size:17px; font-weight:800; color:var(--navy); line-height:1.35; }
  .chip{ font-family:var(--maru); font-size:13px; font-weight:800; color:#fff; padding:4px 11px; border-radius:7px; background:var(--mkcolor,var(--shu)); letter-spacing:.05em; }
  .replay{ width:52px; height:52px; border-radius:50%; border:2px solid rgba(32,48,79,.2); background:#fff; font-size:24px; color:var(--navy); cursor:pointer; flex:0 0 auto; }
  .replay:disabled{ opacity:.28; }
  .q-grid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:8px 16px 4px; align-content:center; max-width:720px; width:100%; margin:0 auto; }
  .cell{ position:relative; background:#fffdf8; border:3px solid var(--line); border-radius:18px; padding:11px 9px 8px;
         display:flex; flex-direction:column; align-items:center; gap:6px; min-height:150px; cursor:pointer; transition:border-color .14s; }
  .cell img{ width:100%; max-height:150px; aspect-ratio:1; object-fit:contain; }
  .cell .lab{ font-family:var(--maru); font-size:20px; font-weight:800; color:var(--ink); }
  .cell .placed{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
                 font-size:60px; font-weight:900; color:var(--mkcolor,var(--shu)); opacity:0; transform:scale(.5); transition:.16s; }
  .cell.pick .placed{ opacity:.92; transform:scale(1); }
  .cell.pick{ border-color:var(--mkcolor,var(--shu)); }
  .cell .placed .maru-svg{ width:74%; height:74%; }
  .cell.locked .placed{ display:none; }
  .cell .grade{ position:absolute; inset:0; display:none; place-items:center; pointer-events:none; }
  .cell.reveal-correct .grade{ display:grid; }
  .cell .grade .maru-svg{ width:86%; height:86%; }
  .cell.reveal-correct{ border-color:var(--shu); }
  .cell.reveal-wrong{ opacity:.4; }
  .cell.locked{ cursor:default; }
  .q-foot{ padding:12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .kettei{ width:100%; font-family:var(--maru); font-weight:800; font-size:24px; color:#fff; background:var(--shu);
           border:none; border-radius:18px; padding:18px; cursor:pointer; box-shadow:0 5px 0 var(--shu-ink); }
  .kettei:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--shu-ink); }
  .kettei:disabled{ background:#c7bda6; box-shadow:0 5px 0 #b0a68e; cursor:default; }

  /* ---- まちがい直し（バッジ付きボタン） ---- */
  .review-btn{ position:relative; font-family:var(--maru); font-weight:800; font-size:18px; color:var(--shu);
               background:#fff; border:2px solid var(--shu); border-radius:16px; padding:14px 30px;
               min-height:56px; cursor:pointer; }
  .review-btn .n{ position:absolute; top:-9px; right:-9px; min-width:28px; height:28px; padding:0 6px;
                  border-radius:999px; background:var(--shu); color:#fff; font-size:14px; font-weight:800;
                  display:grid; place-items:center; font-variant-numeric:tabular-nums; }
  .review-btn.none{ color:var(--ink-soft); border-color:rgba(32,48,79,.2); }

  /* ---- 親が読むモード ---- */
  .read-pane{ flex:1; display:flex; flex-direction:column; gap:14px; padding:16px; overflow:auto; }
  .read-head{ font-family:var(--maru); font-size:16px; font-weight:800; color:var(--navy); text-align:center; }
  .read-meta{ display:block; font-size:13px; color:var(--ink-soft); font-weight:700; margin-top:5px; }
  .read-body{ background:#fffdf8; border:1px solid rgba(32,48,79,.16); border-radius:14px; padding:16px; }
  .read-scene{ font-family:var(--serif); font-size:19px; line-height:2.1; color:var(--ink); margin-bottom:14px; }
  .read-scene:last-child{ margin-bottom:0; }
  .pace{ height:10px; border-radius:6px; background:rgba(32,48,79,.12); overflow:hidden; }
  .pace i{ display:block; height:100%; width:0; background:var(--shu); border-radius:6px; }

  /* ---- けっか ---- */
  #result{ align-items:center; justify-content:center; text-align:center; }
  .result-body{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:18px; padding:24px; width:100%; max-width:420px; }
  .hanamaru{ font-size:80px; line-height:1; }
  .score{ font-family:var(--serif); font-size:26px; color:var(--navy); margin:0; }
  .score b{ color:var(--shu); font-size:36px; font-variant-numeric:tabular-nums; }
  .marks{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:340px; width:100%; }
  .marks span{ font-size:28px; }
  .moshi-row{ display:flex; align-items:center; gap:10px; font-family:var(--maru); font-size:16px; color:var(--navy);
              background:#ffffffcc; border:1px solid rgba(32,48,79,.14); border-radius:12px; padding:11px 15px; width:100%; }
  .moshi-row b{ margin-left:auto; color:var(--shu); font-variant-numeric:tabular-nums; }
  .stampbook{ background:#ffffffcc; border:1.5px dashed rgba(32,48,79,.32); border-radius:16px; padding:14px 18px; display:flex; align-items:center; gap:14px; }
  .stampbook .slot{ width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-size:28px; background:#0000000a; }
  .stampbook .slot.new{ background:#C9372C18; box-shadow:0 0 0 2px var(--shu); }
  .stampbook .cap{ font-family:var(--maru); font-size:13px; color:var(--ink-soft); text-align:left; line-height:1.5; }
  .result-foot{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .result-foot button{ font-family:var(--maru); font-weight:800; font-size:19px; border-radius:16px; padding:16px 26px; min-height:64px; cursor:pointer; border:none; }
  .again{ background:var(--navy); color:#fff; box-shadow:0 4px 0 #16223a; }
  .tohome{ background:#ffffffcc; color:var(--navy); border:1.5px solid rgba(32,48,79,.24); }

  /* ---- がんばりの きろく ---- */
  #calendar{ background:var(--paper); }
  .cal-wrap{ position:relative; z-index:1; padding:16px; overflow:auto; }
  .cal-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .cal-head h2{ font-family:var(--serif); font-size:22px; color:var(--navy); margin:0; flex:1; }
  .backbtn{ min-height:52px; padding:0 18px; border-radius:14px; border:1.5px solid var(--navy); background:#fff;
            color:var(--navy); font-family:var(--maru); font-size:16px; font-weight:700; cursor:pointer; }
  .streak-banner{ text-align:center; font-family:var(--maru); font-weight:800; color:var(--shu); font-size:17px; margin:2px 0 14px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:520px; margin:0 auto; }
  .dow{ text-align:center; font-family:var(--maru); font-size:12px; color:var(--ink-soft); font-weight:700; }
  .day{ aspect-ratio:1; border:1px solid rgba(32,48,79,.14); border-radius:10px; background:#fffdf8; position:relative; display:grid; place-items:center; }
  .day .n{ position:absolute; top:3px; left:5px; font-size:10px; color:var(--ink-soft); font-family:var(--sans); }
  .day .st{ font-size:26px; }
  .day .st.o{ color:var(--shu); font-weight:800; }
  .cal-note{ text-align:center; font-family:var(--maru); font-size:13px; color:var(--ink-soft); margin-top:14px; }
  .gan-section{ max-width:520px; margin:26px auto 0; }
  .gan-section h3{ font-family:var(--serif); font-size:19px; color:var(--navy); margin:0 0 12px; text-align:center; }
  .stamp-page{ display:grid; grid-template-columns:repeat(5,1fr); gap:9px; max-width:360px; margin:0 auto; }
  .stamp-slot{ aspect-ratio:1; border:1.5px dashed rgba(32,48,79,.28); border-radius:50%; display:grid; place-items:center; font-size:24px; background:#fffdf8; }
  .stamp-slot.filled{ border-style:solid; border-color:var(--shu); }
  .stamp-meta{ text-align:center; font-family:var(--maru); font-size:14px; color:var(--ink-soft); margin-top:12px; }
  .bonus{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .bonus span{ font-size:28px; }
  .badges{ display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:10px; }
  .badge{ background:#fffdf8; border:1.5px solid rgba(32,48,79,.16); border-radius:14px; padding:13px 8px; text-align:center; }
  .badge .ic{ font-size:34px; filter:grayscale(1); opacity:.34; }
  .badge.got .ic{ filter:none; opacity:1; }
  .badge .bn{ font-family:var(--maru); font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:700; line-height:1.4; }
  .badge.got .bn{ color:var(--navy); }

  /* ---- おうちのかた（設定・濃紺） ---- */
  #settings{ background:var(--navy); color:#EAE6DA; }
  .set-wrap{ position:relative; z-index:1; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); overflow:auto; }
  .set-eyebrow{ font-size:11px; letter-spacing:.28em; color:#C9958E; text-transform:uppercase; font-weight:700; font-family:var(--sans); }
  .set-title{ font-family:var(--serif); font-size:24px; margin:4px 0 2px; letter-spacing:.05em; }
  .set-sub{ font-size:13px; color:#9FB0C9; margin:0 0 18px; }
  .field{ margin:18px 0; }
  .field > label{ font-size:15px; font-weight:700; display:block; margin-bottom:10px; color:#B9C6DA; }
  .opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt{ min-height:52px; padding:0 16px; border-radius:14px; border:2px solid #ffffff26; background:#ffffff10;
        font-family:var(--maru); font-size:16px; font-weight:700; color:#EAE6DA; cursor:pointer; }
  .opt.sel{ border-color:var(--shu); background:#C9372C22; color:#fff; }
  .switch-row{ display:flex; align-items:center; gap:12px; font-size:15px; color:#EAE6DA; }
  .switch-row input{ width:22px; height:22px; accent-color:var(--shu); }
  .stock{ color:#9FB0C9; font-size:14px; }
  .opt.school{ min-height:46px; font-size:14px; padding:0 13px; }
  .opt.school .gtag{ font-size:10px; color:#9FB0C9; margin-left:7px; }
  .opt.school.sel .gtag{ color:#E9B7B1; }
  .school-note{ margin-top:10px; font-size:13px; color:#9FB0C9; line-height:1.7; }
  .school-note b{ color:#EAE6DA; }
  .set-back{ min-height:56px; padding:0 22px; border-radius:14px; border:2px solid #ffffff33; background:#ffffff12;
             color:#fff; font-family:var(--maru); font-size:17px; font-weight:700; cursor:pointer; margin-top:8px; }
  .to-report{ min-height:56px; padding:0 22px; border-radius:14px; border:2px solid var(--shu); background:#C9372C22;
              color:#fff; font-family:var(--maru); font-size:17px; font-weight:700; cursor:pointer; margin-bottom:10px; }
  /* ---- オフライン保存（親ゾーン） ---- */
  .dl-bar{ height:10px; border-radius:999px; background:#ffffff1f; overflow:hidden; margin-top:9px; }
  .dl-bar i{ display:block; height:100%; width:0; background:var(--shu); transition:width .25s; }
  .dl-sub{ margin-top:8px; font-size:13px; color:#9FB0C9; line-height:1.7; }
  .dl-sub b{ color:#EAE6DA; }
  .dl-row{ display:flex; gap:10px; margin-top:10px; }
  .dl-row button{ flex:1; min-height:44px; border-radius:12px; border:1px solid #ffffff33; background:#ffffff12;
                  color:#fff; font-family:var(--maru); font-size:14px; font-weight:700; cursor:pointer; }

  /* ---- 成績表（濃紺） ---- */
  #report{ background:var(--navy); color:#EAE6DA; }
  .rep-wrap{ position:relative; z-index:1; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); overflow:auto; display:flex; flex-direction:column; gap:14px; }
  .rep-head{ display:flex; align-items:flex-start; gap:12px; }
  .rep-head .t{ flex:1; }
  #repBody{ display:flex; flex-direction:column; gap:14px; }
  .tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .tile{ background:var(--navy-2); border:1px solid #ffffff14; border-radius:12px; padding:14px 10px; text-align:center; }
  .tile .v{ font-family:var(--serif); font-size:28px; color:#fff; font-variant-numeric:tabular-nums; line-height:1; }
  .tile .v small{ font-size:14px; color:#9FB0C9; }
  .tile .k{ font-size:11px; color:#9FB0C9; margin-top:6px; }
  .rep-card{ background:var(--navy-2); border:1px solid #ffffff14; border-radius:12px; padding:14px; }
  .rep-card h3{ font-family:var(--sans); font-size:12px; font-weight:700; color:#B9C6DA; margin:0 0 12px; letter-spacing:.04em; }
  .tbar{ display:grid; grid-template-columns:78px 1fr 42px; align-items:center; gap:8px; margin:8px 0; }
  .tbar .lbl{ font-size:12px; color:#9FB0C9; }
  .tbar .bar{ height:13px; border-radius:7px; background:#ffffff12; overflow:hidden; }
  .tbar .bar i{ display:block; height:100%; border-radius:7px; background:linear-gradient(90deg,#5E79A6,#8AA2C9); }
  .tbar.weak .bar i{ background:linear-gradient(90deg,var(--shu),#E4695F); }
  .tbar .pct{ font-size:12px; text-align:right; font-variant-numeric:tabular-nums; color:#EAE6DA; }
  .trend{ display:flex; align-items:flex-end; gap:5px; height:64px; }
  .trend i{ flex:1; background:#6E86AE; border-radius:3px 3px 0 0; min-height:4px; }
  .trend i.perfect{ background:var(--hanamaru); }
  .rep-empty{ color:#9FB0C9; font-size:15px; text-align:center; padding:40px 12px; line-height:1.9; }
  .rep-note{ font-size:10px; color:#7E8DA6; text-align:center; }

  /* ---- 親ゲート ---- */
  .overlay{ position:fixed; inset:0; background:#20304Fe6; display:none; align-items:center; justify-content:center; flex-direction:column; gap:20px; color:#fff; text-align:center; padding:24px; z-index:20; }
  .overlay.show{ display:flex; }
  .hold{ width:180px; height:180px; border-radius:50%; border:6px solid #ffffff44; display:grid; place-items:center; font-family:var(--maru); font-size:18px; font-weight:800; position:relative; cursor:pointer; }
  .hold .fill{ position:absolute; inset:-6px; border-radius:50%; border:6px solid var(--shu); clip-path:inset(100% 0 0 0); transition:clip-path 1.6s linear; }

  .gate-sub{ font-size:14px; color:#ffffffaa; }

  .toast{ position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:13px 22px; border-radius:14px; font-size:16px; font-family:var(--maru); font-weight:700; opacity:0; transition:.3s; z-index:30; pointer-events:none; }
  .toast.show{ opacity:1; }

  /* 音声よみこみ中の進行バー（固まって見えないように） */
  .loading{ position:fixed; left:0; top:0; right:0; display:none; align-items:center; gap:12px;
            padding:11px 16px calc(11px + env(safe-area-inset-top,0px)); background:#FBF6E9F2;
            border-bottom:1px solid #00000012; z-index:35; font-family:var(--maru); font-size:13px;

  /* 音が出なかったときの復帰（iOSの自動再生ロック・消音スイッチ・SWキャッシュ対策） */
  .audiofix{ position:fixed; inset:0; background:#0b1b3aee; display:none; place-items:center; z-index:40; padding:24px; }

  .af-card{ text-align:center; color:#fff; font-family:var(--maru); max-width:420px; width:100%; }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none!important; transition:none!important; }
    .maru-draw path{ stroke-dashoffset:0!important; }
  }

</head>

<script>
const CONTENT = "/pro/content/";
const CFG_KEY = "ohanashi_play_cfg_v1";
const CAL_KEY = "ohanashi_play_calendar_v1";
const HIST_KEY = "ohanashi_play_history_v1";
const REVIEW_KEY = "ohanashi_play_review_v1";
const REVIEW_STEPS = [1, 3, 7];   // 変奏復習の忘却曲線: 翌日 → 3日 → 1週間 で卒業
const SPEECH_RATE = {1:280, 2:300, 3:300, 4:320, 5:340};   // 字/分（親が読むときの目安）
const TYPE_JA = {T1:"直接記憶", T2:"数", T3:"季節", T4:"順序", T5:"心情",
                 T6:"合致絵", T7:"非登場", T8:"発言者", T9:"二重順序", T10:"状態変化"};
const K_COLOR = {aka:"var(--k-aka)", ao:"var(--k-ao)", midori:"var(--k-midori)", kuro:"var(--k-kuro)", kiiro:"var(--k-kiiro)"};
const MARK = {maru:"○", sankaku:"△", shikaku:"□", batsu:"×"};
const COLOR_JA = {aka:"あかい", ao:"あおい", midori:"みどりの", kuro:"くろい", kiiro:"きいろい"};
const MARK_JA = {maru:"まる", sankaku:"さんかく", shikaku:"しかく", batsu:"ばつ"};
const GROUPS = [
  {k:"C", name:"C（関西・生活常識）"}, {k:"A", name:"A（難関・長文精読）"},
  {k:"B", name:"B（標準）"}, {k:"D", name:"D（心情・短文3話）"}, {k:"E", name:"E（国立・長文）"},
];
const GROUP_SHORT = {A:"A", B:"B", C:"C", D:"D", E:"E"};
// 志望校 → 出題タイプ(グループ)の対応。正本は docs/handoff/spec §1.1。
const SCHOOLS = [
  {n:"慶應義塾横浜初等部", g:"B"}, {n:"慶應義塾幼稚舎", g:"B"}, {n:"暁星", g:"B"}, {n:"洛南", g:"B"},
  {n:"桐蔭学園", g:"D"},
  {n:"森村学園初等部", g:"C"}, {n:"学習院", g:"C"}, {n:"立教", g:"C"}, {n:"成蹊", g:"C"},
  {n:"早稲田実業", g:"C"}, {n:"立命館", g:"C"}, {n:"同志社", g:"C"}, {n:"関西学院", g:"C"},
  {n:"雙葉", g:"A"}, {n:"白百合", g:"A"}, {n:"聖心", g:"A"}, {n:"横浜雙葉", g:"A"},
  {n:"田園調布雙葉", g:"A"}, {n:"東洋英和", g:"A"}, {n:"光塩", g:"A"},
  {n:"筑波大附属", g:"E"}, {n:"お茶の水女子大附属", g:"E"}, {n:"学芸大附属", g:"E"},
];
// 各タイプの「本番相当レベル」= そこまで上げれば入試と同じ長さ・設問数になる目安（仕様§1.2の難易度マトリクス由来）
const TARGET_LV = {A:5, B:5, C:4, D:5, E:5};
const GROUP_DESC = {A:"長文精読型", B:"高速処理型", C:"標準バランス型", D:"短文・心情型", E:"国立型"};
const TIME_LIMIT = {1:20, 2:20, 3:15, 4:15, 5:12};
const MOSHI_N = 3;   // 模試で通す お話の数
const MARU_PATH = "M50 6 C18 4 5 34 8 58 C11 88 44 99 70 94 C96 89 98 54 88 33 C78 14 40 7 40 7";
const STAMP_RANK = ["🌸","🎏","🎐","⭐","🍡","🏮","🎋","🪁"];

let MANIFEST = [], ALIAS = {}, LABELS = {}, DEFECTS = [];   // DEFECTS=検品で欠陥確定→出題から除外中
let cfg = Object.assign({group:"C", level:1, yasashii:true, noise:false, parentRead:false,
                         schools:[], levelMode:"manual"},
                        JSON.parse(localStorage.getItem(CFG_KEY) || "{}"));
function newPlayer(){
  const a=new Audio();
  a.setAttribute("playsinline","");           // iOS: 全画面プレイヤーに奪われない
  a.preload="auto";
  return a;
}
let audio = newPlayer();
try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
                                             // iOS16.4+: マナースイッチ(消音)で音声が消えるのを防ぐ
let session = null;
let audioReady = false, playSeq = 0, lastAudioErr = "";

function saveCfg(){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); document.getElementById(id).classList.add("active"); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
// こども画面は軽量版(448px WebP・1枚 約40KB)を使う。正本の1024px PNG(約1MB)は
// 検品UI用。回線が細いときの待ち時間とオフライン保存の容量を1/20以下にするため。
function canonImg(key){ const c=ALIAS[key]||key; return `${CONTENT}images_small/${esc(c)}.webp`; }
// 軽量版が無い絵は正本PNGにフォールバックし、それも無ければ隠す（文字ラベルだけ残る）
function imgFallback(el){
  if(!el.dataset.fb){ el.dataset.fb="1";
    el.src=el.src.replace("/images_small/","/images/").replace(/\.webp$/,".png"); }
  else { el.style.visibility="hidden"; }
}
function label(id){ return LABELS[id] || id; }
function maruSVG(hand){ return `<svg class="maru-svg${hand?" k":""}" viewBox="0 0 100 100" aria-hidden="true"><path d="${MARU_PATH}"/></svg>`; }
function easy(){ return cfg.yasashii && !(session && session.strict); }

// ---------- データ ----------
Promise.all([
  fetch(CONTENT+"review_manifest.json").then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})),
  fetch(CONTENT+"image_alias_map.json").then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch(CONTENT+"choice_labels.json").then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch(CONTENT+"defect_units.json").then(r=>r.ok?r.json():{units:[]}).catch(()=>({units:[]})),
]).then(([m,a,l,d])=>{
  ALIAS=a||{}; LABELS=l||{}; DEFECTS=(d&&d.units)||[];
  // 検品で欠陥が確定したユニットは出題しない（データは残す＝直したら戻せる）
  const bad=new Set(DEFECTS);
  MANIFEST=(m.items||[]).filter(it=>!bad.has(it.unit_id));
  refreshToday();
});

// 志望校が選ばれていれば、その学校のタイプ(併願なら複数)から出題する。未選択なら手動のグループ。
function activeGroups(){
  const gs=(cfg.schools||[]).map(n=>(SCHOOLS.find(s=>s.n===n)||{}).g).filter(Boolean);
  return gs.length ? [...new Set(gs)] : [cfg.group];
}
function unitsFor(g,l){
  const groups = Array.isArray(g) ? g : [g];
  return MANIFEST.filter(it=>groups.includes(it.group) && it.level===l);
}
function poolNow(){ return unitsFor(activeGroups(), cfg.level); }
// 志望校の本番相当レベル（併願なら最も高いものに合わせる）
function targetLevel(){
  const gs=activeGroups();
  return Math.max(...gs.map(g=>TARGET_LV[g]||5));
}
function refreshToday(){
  const el=document.getElementById("todayTag");
  const schools=cfg.schools||[];
  if(schools.length){
    const names = schools.length<=2 ? schools.join("・") : `${schools[0]} ほか${schools.length-1}校`;
    el.innerHTML = `${esc(names)} コース<br><span style="font-size:13px">レベル${cfg.level}`
      + (cfg.levelMode==="auto" ? `（おまかせ・本番はレベル${targetLevel()}）` : "") + `</span>`;
  } else {
    el.textContent = `きょうは ${GROUP_SHORT[cfg.group]||cfg.group}グループ・レベル${cfg.level}`;
  }
  refreshReviewBadge();
}

// おまかせレベル: 直近の成績を見て、本番相当レベルまで少しずつ上げる（下げるときは1段ずつ）
function autoAdjustLevel(){
  if(cfg.levelMode!=="auto") return;
  const hist=loadHist().filter(s=>s.l===cfg.level).slice(-3);
  if(hist.length<2) return;                       // 判断材料が足りないうちは動かさない
  let n=0, ok=0;
  hist.forEach(s=>s.a.forEach(x=>{ n++; ok+=x.c; }));
  if(!n) return;
  const rate=ok/n;
  const before=cfg.level;
  if(rate>=0.8 && cfg.level<targetLevel()) cfg.level++;
  else if(rate<0.5 && cfg.level>1) cfg.level--;
  if(cfg.level!==before){
    // 在庫が無いレベルには移さない
    if(!unitsFor(activeGroups(), cfg.level).length){ cfg.level=before; return; }
    saveCfg();
    toast(cfg.level>before ? `レベル${cfg.level}に あがったよ！` : `レベル${cfg.level}に もどすね`);
  }
}

// ---------- まちがい直し（変奏復習・忘却曲線） ----------
function loadReview(){ try{ return JSON.parse(localStorage.getItem(REVIEW_KEY)||"{}"); }catch(e){ return {}; } }
function saveReview(r){ localStorage.setItem(REVIEW_KEY, JSON.stringify(r)); }
function dayKey(d){ return d.toLocaleDateString("sv"); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return dayKey(d); }

// 誤答は翌日に再出題。正解するたび間隔を延ばし、1週間を通過したら卒業（キューから消える）。
function scheduleReview(unitId, qId, correct){
  const r=loadReview(), key=unitId+"|"+qId, cur=r[key];
  if(correct){
    if(!cur) return;                                   // もともと正解の問題は積まない
    const st=(cur.stage||0)+1;
    if(st>=REVIEW_STEPS.length) delete r[key];         // 卒業
    else r[key]={u:unitId, q:qId, stage:st, due:addDays(REVIEW_STEPS[st])};
  } else {
    r[key]={u:unitId, q:qId, stage:0, due:addDays(REVIEW_STEPS[0])};
  }
  saveReview(r);
}
function dueReviewItems(){
  const today=dayKey(new Date());
  return Object.values(loadReview()).filter(x=>x && x.due && x.due<=today);
}
function refreshReviewBadge(){
  const btn=document.getElementById("reviewBtn"), n=dueReviewItems().length;
  if(!btn) return;
  document.getElementById("reviewN").textContent=n;
  btn.classList.toggle("none", n===0);
}
function startReview(){
  const due=dueReviewItems();
  const byUnit={};
  due.forEach(x=>{ (byUnit[x.u]=byUnit[x.u]||[]).push(x.q); });
  const queue=[];
  const savedOnly = !navigator.onLine ? offlineUnits() : null;   // オフラインは保存した話だけ
  Object.keys(byUnit).forEach(uid=>{
    if(savedOnly && !savedOnly.has(uid)) return;
    const src=MANIFEST.find(it=>it.unit_id===uid); if(!src) return;
    const qs=src.questions.filter(q=>byUnit[uid].indexOf(q.q_id)>=0);
    if(qs.length) queue.push(Object.assign({}, src, {questions:qs}));   // 該当設問だけの複製ユニット
  });
  if(!queue.length){ toast(navigator.onLine ? "きょうは まちがいなおしは ありません"
                                            : "いま インターネットが ないので まちがいなおしは できません"); return; }
  session={ mode:"review", strict:false, queue, ui:0, unit:queue[0], qi:0, answers:[], results:[] };
  prefetchUnit(session.unit);   // 設問の音声もここで先読みしておく（もんだいへ進んだ瞬間に鳴らす）
  show("play"); audioUnlock().then(()=>runInstruction());
}

// ---------- 会場ノイズ（音源ファイル不要・WebAudioで合成） ----------
let noiseCtx=null, noiseNodes=null;
function startNoise(){
  if(!cfg.noise) return;
  try{
    noiseCtx = noiseCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(noiseCtx.state==="suspended") noiseCtx.resume();
    const ctx=noiseCtx;
    const buf=ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
    const g=ctx.createGain(); g.gain.value=0.012;        // ごく薄く（本文の聞き取りを邪魔しない）
    src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
    noiseNodes={src, g, timer:null};
    const tick=()=>{                                     // 鉛筆・椅子のような小さな物音をときどき
      if(!noiseNodes) return;
      const o=ctx.createOscillator(), og=ctx.createGain(), t=ctx.currentTime;
      o.type="triangle"; o.frequency.value=180+Math.random()*220;
      og.gain.setValueAtTime(0.0001,t);
      og.gain.exponentialRampToValueAtTime(0.02, t+0.01);
      og.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
      o.connect(og); og.connect(ctx.destination); o.start(t); o.stop(t+0.14);
      noiseNodes.timer=setTimeout(tick, 2500+Math.random()*4000);
    };
    noiseNodes.timer=setTimeout(tick, 2000+Math.random()*3000);
  }catch(e){ /* 非対応環境ではノイズなしで進む */ }
}
function stopNoise(){
  if(!noiseNodes) return;
  try{ clearTimeout(noiseNodes.timer); noiseNodes.src.stop(); }catch(e){}
  noiseNodes=null;
}

}

function startMoshi(){

  const queue = pool.slice(0, Math.min(MOSHI_N, pool.length));
  session = { mode:"moshi", strict:true, queue, ui:0, unit:queue[0], qi:0, answers:[], results:[] };
  prefetchUnit(session.unit);   // 設問の音声もここで先読みしておく（もんだいへ進んだ瞬間に鳴らす）

// ---------- 音声（iOS対策はここに集約。旧アプリ static/index.html の実績実装に合わせてある） ----------
// 解錠用の無音音声。壊れた/デコードできないdata URIだとタップの解錠が無駄になるので、
// どのブラウザでも確実に鳴る 8kHz 8bit モノラルの無音WAV(25ms)を使う。
const SILENT_WAV = "data:audio/wav;base64,UklGRuwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YcgAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
function resetAudioEvents(){ audio.onended=null; audio.onerror=null; audio.oncanplay=null; audio.onloadeddata=null; }
function audioUnlock(){
  return new Promise((resolve)=>{
    let settled=false;
    const done=()=>{ if(settled)return; settled=true; audio.muted=false; resolve(); };
    setTimeout(done, 700);        // 解錠の返事を待って固まらない（無音MP3のpromiseは環境により永久に未解決）
    try{
      resetAudioEvents();
      audio.muted=true; audio.src=SILENT_WAV;
      const p=audio.play();
      if(p&&p.then) p.then(()=>{ audioReady=true; try{audio.pause();}catch(e){} done(); })
                     .catch(e=>{ lastAudioErr=(e&&e.name)||"unlock"; done(); });
      else { audioReady=true; done(); }
    }catch(e){ lastAudioErr="unlock-ex"; done(); }
  });
}
// mp3は「自分で取ってきて blob として鳴らす」。メディア要素にURLを直接渡すと
// Rangeリクエストになり、Service Worker のキャッシュ(200全文)と噛み合わずiOSで無音になる。
// blobなら端末内で即再生できるのでSWの有無に左右されない（旧アプリの実績実装と同じ）。
const blobCache = new Map();     // src -> objectURL（取得ずみ）
const inflight  = new Map();     // src -> Promise（二重取得しない）
const dlProgress= new Map();     // src -> 0..1（進行バー用）
async function fetchAudioBlob(src){
  const res = await fetch(src);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const total = +(res.headers.get("content-length") || 0);
  let b;
  if(res.body && res.body.getReader && total){        // 進捗が取れる経路
    const rd=res.body.getReader(), chunks=[]; let got=0;
    for(;;){ const r=await rd.read(); if(r.done) break;
      chunks.push(r.value); got+=r.value.length; dlProgress.set(src, Math.min(1, got/total)); }
    b=new Blob(chunks, {type: res.headers.get("content-type")||"audio/mpeg"});
  } else { b=await res.blob(); }
  dlProgress.set(src, 1);
  if(!b || b.size < 500) throw new Error("empty "+(b?b.size:0));   // 空応答を焼き付けて永久無音になるのを防ぐ
  return URL.createObjectURL(b);
}
function audioURL(src){
  if(blobCache.has(src)) return Promise.resolve(blobCache.get(src));
  if(inflight.has(src)) return inflight.get(src);
  const p = fetchAudioBlob(src).then(u=>{
    inflight.delete(src); blobCache.set(src, u); trimBlobs(); return u;
  }).catch(e=>{ inflight.delete(src); dlProgress.delete(src); throw e; });
  inflight.set(src, p);
  return p;
}
function trimBlobs(){                                  // 端末メモリ対策（再生中のものは消さない）
  while(blobCache.size > 24){
    let killed=false;
    for(const k of blobCache.keys()){
      if(blobCache.get(k)===audio.src) continue;
      try{ URL.revokeObjectURL(blobCache.get(k)); }catch(e){}
      blobCache.delete(k); dlProgress.delete(k); killed=true; break;
    }
    if(!killed) break;
  }
}
// お話に入った時点で、本文と全設問の音声を裏で取っておく（設問に進んだ瞬間に鳴らせるように）
function prefetchUnit(unit){
  if(!unit) return;
  const list=[];
  if(unit.story_audio) list.push(CONTENT+unit.story_audio);
  (unit.questions||[]).forEach(q=>{ if(q.audio) list.push(CONTENT+q.audio); });
  const nx = session && session.queue && session.queue[(session.ui||0)+1];
  if(nx && nx.story_audio) list.push(CONTENT+nx.story_audio);   // 模試・復習では次のお話の本文も
  list.reduce((p,u)=>p.then(()=>audioURL(u).catch(()=>{})), Promise.resolve());
}
// よみこみ中は進行バーを出す（止まって見えるのを防ぐ）。取得ずみなら何もしない。
function ensureLoading(){
  let el=document.getElementById("loadingBar");
  if(!el){
    el=document.createElement("div"); el.id="loadingBar"; el.className="loading";
    el.innerHTML=`<span>おとを よみこんでいます…</span><span class="lbar"><i></i></span>`;
    document.body.appendChild(el);
  }
  return el;
}
function loadingWatch(src){
  if(blobCache.has(src)) return ()=>{};
  const el=ensureLoading(), bar=el.querySelector("i");
  el.classList.add("show"); bar.style.width="0%";
  let raf=0; const t0=performance.now();
  const tick=()=>{
    const p=dlProgress.get(src);
    // 進捗が取れない環境では時間ベースで9割まで伸ばす（バーが固まって見えないように）
    const v=(typeof p==="number") ? p : Math.min(0.9, (performance.now()-t0)/4000);
    bar.style.width=(v*100).toFixed(1)+"%";
    raf=requestAnimationFrame(tick);
  };
  tick();
  return ()=>{ cancelAnimationFrame(raf); bar.style.width="100%"; setTimeout(()=>el.classList.remove("show"), 180); };
}
// 再生する。失敗しても「無音のまま先へ進む」ことは絶対にしない
// （1回だけ自動リトライ → だめならタップで鳴らす画面を出して待つ）。
function playAudio(src){
  const seq = ++playSeq;
  return new Promise((resolve)=>{
    const start=async (n)=>{
      if(seq!==playSeq){ resolve(); return; }              // 新しい再生に置き換わった＝この再生は破棄
      let done=false;
      const fin =()=>{ if(done)return; done=true; resetAudioEvents(); resolve(); };
      const fail=(why)=>{
        if(done)return; done=true; lastAudioErr=why||"err"; resetAudioEvents();
        audio=newPlayer();          // 壊れたソースを食った要素は以後まともに鳴らない。作り直して逃げる
        if(n===0){ blobCache.delete(src); setTimeout(()=>start(1), 400); return; }  // 一過性なら1回だけ再挑戦
        askTapToPlay(src, seq, resolve);
      };
      let url;
      const stopBar=loadingWatch(src);
      try{ url=await audioURL(src); stopBar(); }
      catch(e){ stopBar(); fail("fetch:"+((e&&e.message)||"ng")); return; }   // 取れないものを要素に渡さない
      if(seq!==playSeq){ resolve(); return; }
      audio.onended=fin;
      audio.onerror=()=>fail("load");
      try{
        audio.muted=false; audio.src=url; audio.load();
        // canplaythrough を待つのは禁止（長い音声・iOSで不発になり永久固着＝無音）。
        // canplay/loadeddata をタイムアウト付きで軽く待ち、来なくても再生に進む。
        await Promise.race([
          new Promise(r=>{ audio.oncanplay=r; audio.onloadeddata=r; }),
          new Promise(r=>setTimeout(r,1200)),
        ]);
        audio.oncanplay=null; audio.onloadeddata=null;
        if(done || seq!==playSeq) return;
        const p=audio.play();
        if(p&&p.catch) p.catch(e=>fail((e&&e.name)||"play"));
      }catch(e){ fail("exception"); }
    };
    start(0);
  });
}
function ensureAudioFix(){
  let ov=document.getElementById("audioFix");
  if(!ov){
    ov=document.createElement("div"); ov.id="audioFix"; ov.className="audiofix";
    ov.innerHTML=`<div class="af-card">
        <div class="af-title">おとが でませんでした</div>
        <div class="af-sub">したの ボタンを おしてね</div>
        <button class="af-go" type="button">▶ おとを ならす</button>
        <button class="af-skip" type="button">おとなしで すすむ</button>
        <div class="af-note"></div>
      </div>`;
    document.body.appendChild(ov);
  }
  return ov;
}
function askTapToPlay(src, seq, resolve){
  stopNoise();
  const ov=ensureAudioFix(), sub=ov.querySelector(".af-sub"), note=ov.querySelector(".af-note");
  sub.textContent="したの ボタンを おしてね";
  note.textContent=`${lastAudioErr} / unlock:${audioReady?"ok":"ng"} / sw:${(navigator.serviceWorker&&navigator.serviceWorker.controller)?"on":"off"}`;
  ov.classList.add("show");
  const close=()=>ov.classList.remove("show");
  audioURL(src).catch(()=>{});                            // 次のタップで即鳴らせるよう裏で取っておく
  ov.querySelector(".af-go").onclick=()=>{                 // ユーザー操作の中で直接 play する（iOSはこれなら通る）
    const url=blobCache.get(src);   // ここで await すると iOS はユーザー操作の資格を失う。同期で決める
    if(!url){                       // まだ取れていない＝取り直し中。もう一度押してもらう
      sub.textContent="よみこみちゅう… もういちど おしてね";
      audioURL(src).catch(()=>{ sub.textContent="おとが よみこめません。おとなしで すすめます"; });
      return;
    }
    resetAudioEvents();
    audio.onended=()=>{ resetAudioEvents(); close(); if(seq===playSeq) resolve(); };
    audio.onerror=()=>{ sub.textContent="もういちど おしてみてね"; note.textContent="load / "+note.textContent; };
    try{
      audio.muted=false; audio.src=url; audio.load();
      const p=audio.play();
      if(p&&p.then) p.then(()=>{ audioReady=true; close(); })
                     .catch(e=>{ sub.textContent="もういちど おしてみてね"; note.textContent=((e&&e.name)||"play")+" / "+note.textContent; });
      else close();
    }catch(e){ sub.textContent="もういちど おしてみてね"; }
  };
  ov.querySelector(".af-skip").onclick=()=>{ resetAudioEvents(); close(); if(seq===playSeq) resolve(); };
}

// STEP1: 指示
function runInstruction(){

// STEP2: 本文（おうちのかたが読む／音声で聞く）
function runStory(){

// STEP3: 設問
function runQuestion(){
  const unit=session.unit, q=unit.questions[session.qi];
  const col=K_COLOR[q.instruction.color]||"var(--shu)", mk=MARK[q.instruction.mark]||"○", multi=q.instruction.multi;
  const stage=document.getElementById("stage");
  stage.innerHTML =
    `<div class="q-top" style="--mkcolor:${col}">
       <svg class="ring" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="24"/><circle class="fg" id="ringFg" cx="28" cy="28" r="24"/></svg>
       <div class="q-instr"><span class="q-mark">${mk}</span>
         <span class="q-say">${COLOR_JA[q.instruction.color]||""} ${MARK_JA[q.instruction.mark]||"まる"}を${multi?" ぜんぶに":""}<br>つけてね</span></div>
       <span class="chip">${COLOR_JA[q.instruction.color]||"あか"}</span>
       <button class="replay" id="replayBtn" aria-label="もういちど" ${easy()?"":"disabled"}>🔁</button>
     </div>
     <div class="q-grid" style="--mkcolor:${col}">
       ${q.choices.map((c,i)=>`
         <button class="cell" data-i="${i}">
           <img src="${canonImg(c.image_key)}" onerror="imgFallback(this)" alt="">
           <span class="lab">${esc(label(c.id))}</span>
           <span class="placed">${q.instruction.mark==="maru"?maruSVG(true):esc(mk)}</span>
           <span class="grade">${maruSVG(false)}</span>
         </button>`).join("")}
     </div>`;
  const foot=document.getElementById("confirmWrap"); foot.style.display="block";
  const confirm=document.getElementById("confirmBtn"); confirm.disabled=true; confirm.textContent="けってい";
  const picked=new Set();
  stage.querySelectorAll(".cell").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(btn.classList.contains("locked")) return;
      const i=+btn.dataset.i;
      if(multi){ if(picked.has(i)){picked.delete(i);btn.classList.remove("pick");} else {picked.add(i);btn.classList.add("pick");} }
      else { picked.clear(); stage.querySelectorAll(".cell").forEach(b=>b.classList.remove("pick")); picked.add(i); btn.classList.add("pick"); }
      confirm.disabled = picked.size===0;
    });
  });
  document.getElementById("replayBtn").onclick=(e)=>{ e.currentTarget.disabled=true; playAudio(CONTENT+q.audio); };
  confirm.onclick=()=>{ if(picked.size) grade(q, picked); };
  playAudio(CONTENT + q.audio).then(()=>startRing(q));
}
function startRing(q){
  const fg=document.getElementById("ringFg"); if(!fg) return;
  let limit=TIME_LIMIT[q.level]||15; if(easy()) limit=Math.round(limit*1.5);
  const total=151, t0=performance.now();
  (function tick(now){
    if(document.getElementById("ringFg")!==fg) return;
    const p=Math.min(1,(now-t0)/(limit*1000));
    fg.setAttribute("stroke-dashoffset",(total*p).toFixed(1));
    if(p<1) requestAnimationFrame(tick);
  })(t0);
}
// STEP4: 採点
function grade(q, picked){
  const stage=document.getElementById("stage");
  const correctIdx=q.choices.map((c,i)=>q.correct.includes(c.id)?i:-1).filter(i=>i>=0);
  const pa=[...picked].sort();
  const ok = pa.length===correctIdx.length && pa.every(i=>correctIdx.includes(i));
  session.answers.push({q_id:q.q_id, type:q.type, correct:ok});
  scheduleReview(session.unit.unit_id, q.q_id, ok);   // 誤答は翌日へ／正解なら間隔を延ばす
  document.getElementById("confirmBtn").disabled=true;
  const rb=document.getElementById("replayBtn"); if(rb) rb.disabled=true;
  stage.querySelectorAll(".cell").forEach((btn,i)=>{
    btn.classList.add("locked");
    if(correctIdx.includes(i)){ btn.classList.add("reveal-correct");
      const g=btn.querySelector(".grade"); requestAnimationFrame(()=>g.querySelector(".maru-svg").classList.add("maru-draw","run")); }
    else if(picked.has(i)) btn.classList.add("reveal-wrong");
  });
  setTimeout(()=>{ session.qi++;
    if(session.qi < session.unit.questions.length) runQuestion(); else completeUnit();
  }, 1900);
}
// STEP5: 1話の完了 → 記録して次へ / けっか
function completeUnit(){
  stopNoise();
  refreshReviewBadge();
  const ans=session.answers, n=ans.length, ok=ans.filter(a=>a.correct).length, perfect=ok===n;
  recordDay(perfect, ok, n);
  recordHistory(session.unit.group, session.unit.level, ans);
  if(session.mode==="single") autoAdjustLevel();   // おまかせレベルは通常練習でのみ動かす
  if(session.mode==="moshi" || session.mode==="review"){
    session.results.push({theme:session.unit.theme, ok, n});
    session.ui++;
    if(session.ui < session.queue.length){
      session.unit=session.queue[session.ui]; session.qi=0; session.answers=[];
      prefetchUnit(session.unit);
      runInstruction();
    } else showMultiResult();
  } else showSingleResult(ok, n);
}

// ---------- 記録（カレンダー・履歴） ----------
function loadCal(){ try{ return JSON.parse(localStorage.getItem(CAL_KEY)||"{}"); }catch(e){ return {}; } }
function recordDay(perfect, ok, total){
  const cal=loadCal(), key=new Date().toLocaleDateString("sv");
  const p=cal[key]||{solved:0,best:0,perfect:false};
  cal[key]={ solved:p.solved+1, best:Math.max(p.best,ok), total, perfect:p.perfect||perfect };
  localStorage.setItem(CAL_KEY, JSON.stringify(cal));
}
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)||"[]"); }catch(e){ return []; } }
function recordHistory(group, level, answers){
  const h=loadHist();
  h.push({ d:new Date().toISOString(), g:group, l:level, a:answers.map(x=>({t:x.type, c:x.correct?1:0})) });
  while(h.length>300) h.shift();
  localStorage.setItem(HIST_KEY, JSON.stringify(h));
}
function calcStreak(){
  const cal=loadCal(); const d=new Date();
  if(!cal[d.toLocaleDateString("sv")]) d.setDate(d.getDate()-1);
  let s=0; while(cal[d.toLocaleDateString("sv")]){ s++; d.setDate(d.getDate()-1); } return s;
}
function maxStreak(cal){
  const days=Object.keys(cal).sort(); if(!days.length) return 0;
  let best=1, cur=1;
  for(let i=1;i<days.length;i++){
    const diff=Math.round((new Date(days[i])-new Date(days[i-1]))/86400000);
    if(diff===1){ cur++; best=Math.max(best,cur); } else if(diff!==0){ cur=1; }
  }
  return best;
}

// ---------- がんばりの きろく（カレンダー＋スタンプ＋バッジ） ----------
function renderGanbari(){
  const cal=loadCal(), hist=loadHist(), now=new Date(), y=now.getFullYear(), mo=now.getMonth();
  document.getElementById("calTitle").textContent=`${y}ねん ${mo+1}がつ`;
  document.getElementById("calNo").textContent=`${mo+1}がつ`;
  const streak=calcStreak();
  document.getElementById("streakBanner").textContent = streak>0 ? `🔥 ${streak}にち れんぞく！` : "きょうも やってみよう";
  // カレンダー
  const dows=["にち","げつ","か","すい","もく","きん","ど"];
  let h=dows.map(d=>`<div class="dow">${d}</div>`).join("");
  const first=new Date(y,mo,1).getDay(), days=new Date(y,mo+1,0).getDate(), today=now.getDate();
  for(let i=0;i<first;i++) h+="<div></div>";
  for(let d=1;d<=days;d++){
    const rec=cal[new Date(y,mo,d).toLocaleDateString("sv")];
    let m=""; if(rec) m = rec.perfect?`<span class="st">🌸</span>`:`<span class="st o">○</span>`;
    h+=`<div class="day"${d===today?' style="box-shadow:0 0 0 2px var(--shu)"':""}><span class="n">${d}</span>${m}</div>`;
  }
  document.getElementById("calGrid").innerHTML=h;
  // スタンプ帳
  let totalQ=0; hist.forEach(s=>totalQ+=s.a.length);
  const pages=Math.floor(totalQ/10), onPage=totalQ%10, filled=(totalQ>0&&onPage===0)?10:onPage;
  let slots=""; for(let i=0;i<10;i++) slots+=`<div class="stamp-slot ${i<filled?"filled":""}">${i<filled?"⭕":""}</div>`;
  let bonus=""; for(let i=0;i<pages;i++) bonus+=`<span>${STAMP_RANK[i%STAMP_RANK.length]}</span>`;
  document.getElementById("stampSection").innerHTML=`
    <div class="gan-section"><h3>スタンプ帳</h3>
      <div class="stamp-page">${slots}</div>
      <div class="stamp-meta">あつめた スタンプ ${totalQ}こ ・ できた ページ ${pages}まい</div>
      ${pages?`<div class="bonus">${bonus}</div>`:""}
    </div>`;
  // バッジ
  const maxS=maxStreak(cal);
  const anyPerfect=hist.some(s=>s.a.length&&s.a.every(x=>x.c===1));
  const lv3=hist.some(s=>s.l>=3 && s.a.length&&s.a.every(x=>x.c===1));
  const BADGES=[
    {ic:"🌸",n:"はじめての満点",got:anyPerfect},
    {ic:"🔥",n:"7日れんぞく",got:maxS>=7},
    {ic:"⛩️",n:"30日れんぞく",got:maxS>=30},
    {ic:"💯",n:"100もん",got:totalQ>=100},
    {ic:"🏅",n:"500もん",got:totalQ>=500},
    {ic:"📘",n:"レベル3クリア",got:lv3},
  ];
  document.getElementById("badgeSection").innerHTML=`
    <div class="gan-section"><h3>バッジ</h3>
      <div class="badges">${BADGES.map(b=>`<div class="badge ${b.got?"got":""}"><div class="ic">${b.ic}</div><div class="bn">${esc(b.n)}</div></div>`).join("")}</div>
    </div>`;
}

  let n=0, ok=0; const byType={};
  h.forEach(s=>s.a.forEach(x=>{ n++; ok+=x.c; (byType[x.t]=byType[x.t]||{n:0,ok:0}); byType[x.t].n++; byType[x.t].ok+=x.c; }));
  const rate=n?Math.round(ok/n*100):0, streak=calcStreak(), last=h[h.length-1];
  sub.textContent=`${GROUP_SHORT[last.g]||last.g}グループ ・ ${h.length}かい れんしゅう`;
  const rows=Object.entries(byType).map(([t,v])=>({t, r:Math.round(v.ok/v.n*100)})).sort((a,b)=>a.r-b.r);
  const typeHTML=rows.map(row=>`
    <div class="tbar ${row.r<60?"weak":""}"><span class="lbl">${esc(TYPE_JA[row.t]||row.t)}</span>

  const trendHTML=recent.map(s=>`<i class="${s.perfect?"perfect":""}" style="height:${Math.max(6,s.r)}%"></i>`).join("");
  body.innerHTML=`
    <div class="tiles">
      <div class="tile"><div class="v">${h.length}</div><div class="k">れんしゅう</div></div>
      <div class="tile"><div class="v">${rate}<small>%</small></div><div class="k">せいかいりつ</div></div>

}

// ---------- オフライン保存（30話ぶんの音声と絵カードを端末に置く） ----------
// 置き場所は Service Worker と同じ Cache Storage。SWが未登録でも動くよう、
// ページ側から直接 cache.put する（SWの fetch はここを見るので再生に使われる）。
const MEDIA_CACHE = "ohanashi-pro-v2-media";   // ★ play/sw.js の VERSION と合わせる
const SHELL_CACHE = "ohanashi-pro-v2-shell";
const OFFLINE_KEY = "ohanashi_pro_offline_v1";
const OFFLINE_N   = 30;                        // まずは30話（容量をおさえるため）
let offlineAbort=false, offlineBusy=false, offlineFailed=0;   // offlineFailed=取得できなかった数（検証用）

function offlineState(){ try{ return JSON.parse(localStorage.getItem(OFFLINE_KEY)||"{}"); }catch(e){ return {}; } }
function offlineUnits(){ return new Set(offlineState().units||[]); }
function mb(bytes){ return (bytes/1048576).toFixed(1); }

// 保存する話の並び。いまのグループの、いまのレベルを先頭に、近いレベルへ広げていく。
// （1グループ×1レベルは10話前後しか無いので、それだけでは30話に届かない）
function offlineCandidates(){
  const gs=activeGroups(), seen=new Set(), out=[];
  const order=[cfg.level];
  for(let d=1;d<=4;d++){ if(cfg.level+d<=5) order.push(cfg.level+d); if(cfg.level-d>=1) order.push(cfg.level-d); }
  for(const lv of order) for(const u of unitsFor(gs, lv))
    if(!seen.has(u.unit_id)){ seen.add(u.unit_id); out.push(u); }
  return out;
}

// 1話をオフラインで動かすのに必要なURL（本文音声・設問音声・選択肢の絵カード）
function unitAssets(u){
  const urls=[CONTENT+u.story_audio];
  (u.questions||[]).forEach(q=>{
    if(q.audio) urls.push(CONTENT+q.audio);
    (q.choices||[]).forEach(c=>{ if(c.image_key) urls.push(canonImg(c.image_key)); });
  });
  return [...new Set(urls)];
}

async function cachePut(url, cache){
  const hit=await cache.match(url);
  if(hit){ const b=await hit.blob(); return b.size; }        // すでに保存済み
  const res=await fetch(url, {cache:"no-store"});
  if(!res.ok) return 0;
  await cache.put(url, res.clone());
  const b=await res.blob();
  return b.size;
}

function renderOffline(prog){
  const note=document.getElementById("offlineNote");

  const btn=document.getElementById("offlineBtn");

    note.innerHTML=`ほぞん中… <b>${prog.unitDone} / ${prog.units}話</b>（${mb(prog.bytes)} MB）<br>`
      + `とじても だいじょうぶですが、この画面のままの方が はやく終わります`;
    btn.style.display="none";
    return;
  }

      + (d?`<br>${d.getMonth()+1}月${d.getDate()}日に ほぞんしました`:"")
      + `<br>インターネットが なくても この ${s.units.length}話は できます`;
    btn.textContent="📥 いまの せっていで もう一度 ほぞん";

    row.style.display="none";
    const n=Math.min(OFFLINE_N, offlineCandidates().length);
    note.innerHTML="まだ ほぞんしていません。<br>いまの グループの おはなしを、"
      + `いまのレベルから じゅんに <b>${n}話</b>ぶん（おとと え）この端末に ほぞんします。`
      + "<br>Wi-Fiで 1〜3分・50MBほど つかいます。";
    btn.textContent=`📥 ${OFFLINE_N}話を この端末に ほぞん`;
  }
}

async function saveOffline(){
  if(offlineBusy) return;
  const pool=offlineCandidates();
  if(!pool.length){ toast("この せっていの おはなしが ありません"); return; }
  const units=pool.slice(0, OFFLINE_N);
  offlineBusy=true; offlineAbort=false;
  document.getElementById("offlineStop").style.display="block";
  try{
    const media=await caches.open(MEDIA_CACHE), shell=await caches.open(SHELL_CACHE);
    // データ本体（マニフェスト等）も入れておく。これが無いとオフラインで起動できない。
    const shellUrls=["/pro/play","/pro/play.webmanifest",
      CONTENT+"review_manifest.json", CONTENT+"image_alias_map.json",
      CONTENT+"choice_labels.json", CONTENT+"defect_units.json"];
    const lists=units.map(unitAssets);
    const total=shellUrls.length + lists.reduce((n,l)=>n+l.length,0);
    let done=0, bytes=0, unitDone=0, failed=0; offlineFailed=0;
    const tick=()=>renderOffline({done,total,bytes,unitDone,units:units.length});
    tick();
    for(const u of shellUrls){ bytes+=await cachePut(u, shell); done++; tick(); }
    for(let i=0;i<lists.length;i++){
      for(const url of lists[i]){
        if(offlineAbort) break;
        const n=await cachePut(url, media);
        if(!n){ failed++; offlineFailed++; console.warn("[offline] 取得できず", url); }
        bytes+=n; done++;
        if(done%4===0) tick();
      }
      if(offlineAbort) break;
      unitDone++; tick();
    }
    const saved=units.slice(0, unitDone).map(u=>u.unit_id);
    const lvs=[...new Set(units.slice(0, unitDone).map(u=>u.level))].sort();
    const label=`グループ${activeGroups().join("・")} ・ レベル${lvs.join("・")}`;
    localStorage.setItem(OFFLINE_KEY, JSON.stringify(
      {units:saved, bytes, saved_at:new Date().toISOString(), label}));
    renderOffline();
    toast(offlineAbort ? `${saved.length}話まで ほぞんしました`
                       : `${saved.length}話を ほぞんしました（${mb(bytes)} MB）`);
    if(failed) console.warn("[offline] 取得できなかったファイル", failed, "件");
  }catch(e){
    console.error("[offline]", e);
    renderOffline();
    toast("ほぞんに しっぱいしました");
  }finally{
    offlineBusy=false; offlineAbort=false;
    document.getElementById("offlineStop").style.display="none";
  }
}

async function clearOffline(){
  const s=offlineState();
  if(!s.units || !s.units.length) return;
  const media=await caches.open(MEDIA_CACHE);
  const targets=new Set();
  s.units.forEach(id=>{ const u=MANIFEST.find(x=>x.unit_id===id); if(u) unitAssets(u).forEach(x=>targets.add(x)); });
  for(const url of targets) await media.delete(url);
  localStorage.removeItem(OFFLINE_KEY);
  renderOffline();
  toast("ほぞんを けしました");
}
